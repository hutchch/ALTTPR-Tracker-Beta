    btn.title = RACE_MODE ? 'Disabled in Race Mode' : '';
  }
}

// ── BroadcastChannel ─────────────────────────────────────────────────────
try {
  var bc = new BroadcastChannel('alttp-tracker');
  bc.onmessage = function(e) {
    if (!e.data) return;
    if (e.data.type==='items'||e.data.type==='snap') {
      var _snapData = e.data.data||e.data;
      // Keep Race Mode in sync live, even if this window opened before it was set.
      if (_snapData && typeof _snapData.raceMode === 'boolean' && _snapData.raceMode !== RACE_MODE) {
        RACE_MODE = _snapData.raceMode;
        updateRaceModeUI();
      }
      applySnapCoalesced(_snapData);
    }
    else if (e.data.type==='prizes') applyPrizesCoalesced(e.data.data);
    else if (e.data.type==='stats') {
      if(slotEls['stat_check'])slotEls['stat_check'].textContent=e.data.checks||0;
      if(slotEls['stat_death'])slotEls['stat_death'].textContent=e.data.deaths||0;
      if(slotEls['stat_bonk']) slotEls['stat_bonk'].textContent =e.data.bonks ||0;
    }
    else if (e.data.type==='newgame') resetAll();
    else if (e.data.type==='bcast-settings-changed') applyAllSettings();
    // Seed settings from the map's gear menu. Belt to the storage event's
    // braces — neither is reliable alone across Electron windows.
    else if (e.data.type==='worldstate' || e.data.type==='swordless' || e.data.type==='setting') {
      refreshSeedSettings();
    }
  };
} catch(err) { console.error('BroadcastChannel error:', err); }

// Re-apply all view-affecting settings after the popout changes them. Reloads
// SETTINGS from localStorage (shared with the popout) then re-renders. bg is
// read from the saved value so popout bg changes take effect (the launch URL
// bg only seeds the initial load).
function applyAllSettings() {
  var prevViewStyle = SETTINGS.viewStyle;
  loadSettings();
  try {
    var savedBg = localStorage.getItem('alttp-broadcast-bg');
    applyBg(savedBg || SETTINGS.bg);
    applyFillVariable();
    applyDungeonColors();
    applyDungeonBox();
    applyDungeonVisibility();
    refreshAllFills();
    if (SETTINGS.viewStyle !== prevViewStyle) { rebuildRows(); _applyBcastScale(); }
    renderV2View();   // Modern v2's dungeon fill follows the same settings
    updateDngCycle();
  } catch (e) { console.error('applyAllSettings error:', e); }
}

// ── Go Mode Sparklines ────────────────────────────────────────────────────
var _gomodeSparkRaf  = null;
var _gomodeSparkStop = false;

function startGomodeSparks() {
  _gomodeSparkStop = false;
  var canvas = document.getElementById('gomode-spark-canvas');
  if (!canvas) return;
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.classList.add('active');
  var ctx = canvas.getContext('2d');

  var SPARK_PALETTE = (SETTINGS.sparkColors && SETTINGS.sparkColors.length)
    ? SETTINGS.sparkColors
    : ['#22cc55','#66ff88','#aaffbb','#4488ff','#88bbff','#cc44ff'];
  var SPARK_TRAIL = 16;
  var SPARK_SPEED = 2.0;
  var SPARK_SIZE  = 3;

  var _comboSubKeys = {};
  Object.keys(COMBO_SLOTS).forEach(function(ck) {
    COMBO_SLOTS[ck].keys.forEach(function(sk) { _comboSubKeys[sk] = ck; });
  });

  function getSlotRects() {
    var rects = [];
    var seenCombos = {};
    Object.keys(slotContainers).forEach(function(key) {
      if (key === 'gomode' || key === 'stats' || key === 'bottles' || key === 'agahnim') return;
      var val = _appliedItemState[key];
      if (!val || val <= 0) return;
      var comboKey = _comboSubKeys[key];
      if (comboKey) {
        var subEl = slotContainers[key];
        if (subEl && subEl.classList && subEl.classList.contains('bcombo-img')) {
          if (seenCombos[comboKey]) return;
          var anyCollected = COMBO_SLOTS[comboKey].keys.some(function(sk) {
            return (_appliedItemState[sk] || 0) > 0;
          });
          if (!anyCollected) return;
          seenCombos[comboKey] = true;
          var parentEl = subEl.parentElement;
          if (!parentEl) return;
          var r = parentEl.getBoundingClientRect();
          if (r.width >= 4) rects.push({ x: r.left, y: r.top, w: r.width, h: r.height });
          return;
        }
      }
      var el = slotContainers[key];
      if (!el) return;
      // For right-column slots (.bright-slot), trace the inner icon img, not the wide container
      var targetEl = (el.classList && el.classList.contains('bright-slot'))
        ? (el.querySelector('img') || el) : el;
      var r = targetEl.getBoundingClientRect();
      if (r.width < 4 || r.height < 4) return;
      rects.push({ x: r.left, y: r.top, w: r.width, h: r.height });
    });
    var anyBottle = ['bottle1','bottle2','bottle3','bottle4'].some(function(b){ return (_appliedItemState[b]||0) > 0; });
    if (anyBottle && slotContainers['bottles']) {
      var r = slotContainers['bottles'].getBoundingClientRect();
      if (r.width >= 4) rects.push({ x: r.left, y: r.top, w: r.width, h: r.height });
    }
    return rects;
  }

  function makeSparkForRect(rect, tOffset) {
    return { rect: rect, t: tOffset || 0, trail: [] };
  }

  function perimPoint(rect, t) {
    var w = rect.w, h = rect.h;
    var perim = 2 * (w + h);
    t = ((t % perim) + perim) % perim;
    if (t < w)  return { x: rect.x + t,        y: rect.y };
    t -= w;
    if (t < h)  return { x: rect.x + w,         y: rect.y + t };
    t -= h;
    if (t < w)  return { x: rect.x + w - t,     y: rect.y + h };
    t -= w;
                return { x: rect.x,              y: rect.y + h - t };
  }

  var sparks = [];
  var rects  = getSlotRects();
  rects.forEach(function(rect) { sparks.push(makeSparkForRect(rect, 0)); });
  var frameCount = 0;

  function draw() {
    if (_gomodeSparkStop) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.classList.remove('active');
      return;
    }
    frameCount++;
    if (frameCount % 30 === 0) {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      var newRects = getSlotRects();
      if (newRects.length !== rects.length) {
        var syncT = sparks.length > 0 ? sparks[0].t : 0;
        rects = newRects;
        sparks = rects.map(function(rect) {
          var existing = sparks.find(function(s) {
            return Math.abs(s.rect.x - rect.x) < 2 && Math.abs(s.rect.y - rect.y) < 2;
          });
          return existing ? Object.assign(existing, { rect: rect }) : makeSparkForRect(rect, syncT);
        });
      } else {
        rects = newRects;
        sparks = rects.map(function(rect) {
          var existing = sparks.find(function(s) {
            return Math.abs(s.rect.x - rect.x) < 2 && Math.abs(s.rect.y - rect.y) < 2;
          });
          return existing ? Object.assign(existing, { rect: rect }) : makeSparkForRect(rect, sparks.length > 0 ? sparks[0].t : 0);
        });
      }
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    sparks.forEach(function(spark) {
      spark.t += SPARK_SPEED;
      var pos = perimPoint(spark.rect, spark.t);
      spark.trail.push({ x: pos.x, y: pos.y });
      if (spark.trail.length > SPARK_TRAIL) spark.trail.shift();
      var perim = 2 * (spark.rect.w + spark.rect.h);
      for (var i = 0; i < spark.trail.length; i++) {
        var alpha = (i + 1) / spark.trail.length;
        var p = spark.trail[i];
        var tPos = ((spark.t - (spark.trail.length - i) * SPARK_SPEED) % perim + perim) % perim;
        var colorIdx = Math.floor((tPos / perim) * SPARK_PALETTE.length) % SPARK_PALETTE.length;
        ctx.beginPath();
        ctx.arc(p.x, p.y, SPARK_SIZE * alpha, 0, Math.PI * 2);
        ctx.fillStyle = SPARK_PALETTE[colorIdx];
        ctx.globalAlpha = alpha * 0.9;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
    _gomodeSparkRaf = requestAnimationFrame(draw);
  }

  if (_gomodeSparkRaf) cancelAnimationFrame(_gomodeSparkRaf);
  _gomodeSparkRaf = requestAnimationFrame(draw);
}

function stopGomodeSparks() {
  _gomodeSparkStop = true;
  if (_gomodeSparkRaf) { cancelAnimationFrame(_gomodeSparkRaf); _gomodeSparkRaf = null; }
  var canvas = document.getElementById('gomode-spark-canvas');
  if (canvas) {
    canvas.classList.remove('active');
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

var DC_NAMES = { hc: 'Hyrule Castle', ct: "Agahnim's Tower", ep: 'Eastern Palace', dp: 'Desert Palace',

  ip: 'Ice Palace', mm: 'Misery Mire', tr: 'Turtle Rock', gt: "Ganon's Tower" };

    h += '<div class="dc-boss' + (c.bossBeaten ? ' beaten' : '') + '">' +
         (c.bossNum !== null && c.bossNum !== undefined ? '<img src="' + BASE.replace(/items$/, 'boss') + '/boss' + c.bossNum + '.png">' : '') +
         (c.boss || 'Boss') + (c.bossBeaten ? ' ✓' : '') + '</div>';
  }
  el.innerHTML = h + '</div>';
  placeDngCard();
}
// The dungeon row: Modern v2's dungeon boxes, otherwise the last row with
// anything in it (Modern: the dungeons; Classic: PoD to TR and GO).
function dngArea() {
  if (SETTINGS.viewStyle === 'v2') return document.querySelector('.rv-dngs');
  var rows = [].filter.call(document.querySelectorAll('.broadcast-container .bcast-row'), function (r) { return r.children.length; });
  return rows[rows.length - 1] || null;
}
// Put the card over the dungeon row and size its text to fill it.
function placeDngCard() {
  var el = document.getElementById('dng-card'), a = dngArea();
  document.querySelectorAll('.dng-area').forEach(function (x) { if (x !== a) x.classList.remove('dng-area'); });
  if (!el || !a || !document.body.classList.contains('dng-phase')) return;
  a.classList.add('dng-area');
  var r = a.getBoundingClientRect();
  var f = r.height / 3.4;   // two lines: the name (1.1em, its prize 1.5em) and the icons (1.5em)
  el.style.fontSize = f + 'px'; el.style.width = 'max-content';
  var need = el.offsetWidth;   // the card's natural width at that size
  if (need > r.width * 0.96) el.style.fontSize = (f * r.width * 0.96 / need) + 'px';
  el.style.left = r.left + 'px'; el.style.top = r.top + 'px'; el.style.width = r.width + 'px'; el.style.height = r.height + 'px';
}
window.addEventListener('resize', placeDngCard);
// Card first, then items/card for their own times (Broadcast Settings → Dungeon Card).
function updateDngCycle() {
  var on = SETTINGS.dngCycleEnabled && !!_dc.card;
  if (!on || _dc.card.id !== _dc.id) {   // stop, or start over in a new dungeon
    clearTimeout(_dc.timer); _dc.timer = null;
    document.body.classList.remove('dng-phase');
  }
  if (!on) { _dc.id = null; return; }
  renderDngCard();
  if (!_dc.timer) { _dc.id = _dc.card.id; dngPhase(true); }
}
function dngPhase(card) {
  clearTimeout(_dc.timer);
  document.body.classList.toggle('dng-phase', card);
  placeDngCard();
  var secs = card ? SETTINGS.dngCardSecs : SETTINGS.dngItemsSecs;
  _dc.timer = setTimeout(function () { dngPhase(!card); }, Math.max(1, secs || (card ? 5 : 10)) * 1000);
}
// An item animation: back to the items, with their full time (Chris, Oct 2026).
function dngShowItems() { if (_dc.timer) dngPhase(false); }

// Modern v2: repaint after every snapshot and prize update. Wrapped once here
// so every caller of applySnap / applyPrizes is covered.
(function () {
  var _snap = applySnap, _prizes = applyPrizes;
  applySnap = function (s) {
    _snap(s); renderV2View();
    if (s && 'dungeonCard' in s) { _dc.card = s.dungeonCard || null; _dc.floor = s.currentFloor || null; updateDngCycle(); }
  };
  applyPrizes = function (p) {
    if (p) Object.keys(p).forEach(function (k) { _rvPrizes[k] = p[k]; });
    _prizes(p); renderV2View();
  };
})();

// ── Broadcast scale ──────────────────────────────────────────────────────
var _bcastScale = parseInt(localStorage.getItem('bcast-scale') || '100', 10);
function _applyBcastScale() {
  var el = document.querySelector('.broadcast-container');
  if (!el) return;
  el.style.transformOrigin = 'top left';
  // Modern v2 sizes itself (fitV2View, with its own −/+ scale), so no transform here.
  if (SETTINGS.viewStyle === 'v2') { el.style.transform = ''; return; }
  el.style.transform = (_bcastScale === 100) ? '' : 'scale(' + (_bcastScale / 100).toFixed(2) + ')';
}
function bcastSizeDown() {
  if (SETTINGS.viewStyle === 'v2') { _v2Scale = Math.max(30, _v2Scale - 2); localStorage.setItem('bcast-v2-scale', _v2Scale); fitV2View(); return; }
  _bcastScale = Math.max(10, _bcastScale - 2); localStorage.setItem('bcast-scale', _bcastScale); _applyBcastScale();
}
function bcastSizeUp() {
  if (SETTINGS.viewStyle === 'v2') { _v2Scale = Math.min(300, _v2Scale + 2); localStorage.setItem('bcast-v2-scale', _v2Scale); fitV2View(); return; }
  _bcastScale = Math.min(300, _bcastScale + 2); localStorage.setItem('bcast-scale', _bcastScale); _applyBcastScale();
}

// ── Init ─────────────────────────────────────────────────────────────────
function _init() {
  loadSettings();
  updateRaceModeUI();
  applyFillVariable();
  applyDungeonColors();
  buildRows();
  _applyBcastScale();
  applyDungeonVisibility();
  applyBg(SETTINGS.bg);
  setTimeout(function() {
    try { new BroadcastChannel('alttp-tracker').postMessage({type:'requestSnap'}); } catch(e) {}
  }, 500);
}

// If in Electron, resolve the real items path first so BASE is correct before buildRows
if (window.electronAPI && window.electronAPI.getPaths) {
  window.electronAPI.getPaths().then(function(paths) {
    if (paths && paths.itemsUrl) BASE = paths.itemsUrl;
    _init();
  }).catch(function() { _init(); });
} else {
  _init();
}
</script>
</body>
