<!DOCTYPE html>

<body>

<div class="tracker-container"></div>

<div class="tracker-bottom-bar">
  <div class="size-group">
    <button class="size-btn" onclick="changeTrackerScale(-0.05)">&#8722;</button>
    <button class="size-btn" onclick="changeTrackerScale(0.05)">+</button>
    <button class="item-settings-btn" id="item-settings-btn" title="Settings" onclick="openItemSettings()">⚙&#xFE0E; Settings</button>
<button class="item-settings-btn" id="item-broadcast-btn" title="Open Broadcast View" onclick="(function(){ var bg=localStorage.getItem('alttp-tracker-bg')||'black'; if(window.electronAPI&&window.electronAPI.launch){ window.electronAPI.launch({which:'broadcast',trackerBg:bg}); } else { window.open('broadcast.html?bg='+bg,'alttp-broadcast','width=500,height=230,resizable=yes'); } })()" style="background:#1a2e4a;color:#7ab8f5;border:1px solid #2a4e7a;">📡 Broadcast</button>
  </div>
  <div class="connection-status" id="item-conn-status">○ Disconnected</div>
  <span class="race-label" id="item-race-label"></span>
  <span class="mode-label" id="item-mode-label"></span>
  <button class="reconnect-btn" id="item-reconnect-btn" title="Reconnect to QUsb2Snes" onclick="manualReconnect()">↻</button>
  <button class="newgame-btn" id="item-newgame-btn" title="Reset to new game" onclick="resetItemTracker()">⟳ New Game</button>
</div>


<script src="js/dngpanel.js?v=1131a"></script>
<script>
// The pot / enemy-drop table is only read by the dungeon card's rollup, and
// only in the two shuffle modes that use it — fetch it on demand rather than
// carrying 57KB into every session. map.html does the same.
window.ensurePotLocations = function() {
  if (window.POT_LOCATIONS || window._potLoading) return;
  window._potLoading = true;
  var sc = document.createElement('script');
  sc.src = 'js/potlocations.js?v=1122l';
  sc.onload = function() { if (window.refreshDungeonPanel) window.refreshDungeonPanel(); };
  sc.onerror = function() { console.warn('pot locations could not be loaded'); };
  document.head.appendChild(sc);
};
(function() {
  var p = new URLSearchParams(location.search);
  var pottery = p.get('pottery') || localStorage.getItem('alttp-pottery') || 'none';
  var drops   = p.get('enemydrops') || localStorage.getItem('alttp-enemy-drops') || 'no';
  if (pottery !== 'none' || drops === 'yes') window.ensurePotLocations();
  // A setting changed in the map window arrives here as a storage event.
  window.addEventListener('storage', function(ev) {
    if (ev.key === 'alttp-pottery' || ev.key === 'alttp-enemy-drops') {
      if (ev.newValue && ev.newValue !== 'none' && ev.newValue !== 'no') window.ensurePotLocations();
    }
  });
})();
</script>
<script src="js/item-settings.js?v=2"></script>
<script src="js/items.js?v=1136b"></script>
<script src="js/item-sounds.js?v=1"></script>
<script>
// ── Dungeon hover panel (js/dngpanel.js, shared with the map) ─────────────────
// The item tracker knows the real dungeon state — counts, map/compass/big key,
// completion, and which boss was picked — so it supplies all of that. It has no
// logic engine, so there is no Status row here; the map keeps that.
// Availability comes from the map (type 'dungeoncolors'), the only window with
// the logic engine. Restored from localStorage at load so a tracker opened
// second still has colors before the map's next refresh.
try { window._dngColors = JSON.parse(localStorage.getItem('alttp-dungeon-colors') || '{}'); } catch(e) { window._dngColors = {}; }
window.applyDungeonColors = function(colors) {
  if (!colors) return;
  window._dngColors = colors;
  if (window.refreshDungeonPanel) window.refreshDungeonPanel();
};
window.addEventListener('storage', function(e) {
  if (e.key !== 'alttp-dungeon-colors' || !e.newValue) return;
  try { window.applyDungeonColors(JSON.parse(e.newValue)); } catch(ex) {}
});
// A map that was already open when this window launched has nothing new to
// send (it only broadcasts on change), so ask for the current set once.
setTimeout(function() {
  try { if (window._itemsBc) window._itemsBc.postMessage({ type: 'requestColors' }); } catch(e) {}
}, 400);

window.DngPanelHost = {
  // Smaller type here: the tracker window is narrow, and the panel must stay
  // readable at its own size no matter how far the tracker itself is scaled up.
  compact: true,
  // "Show Dungeon Chests" in the tracker's settings menu; off by default. Off =
  // the card keeps its name, status, counts and icons but drops the chest list.
  locations: function() { return ITEM_SETTINGS.dungeonChests === true; },
  status: function(key) {
    // No map open yet → no colors; the line shows just the location name.
    return window.dngStatusFromColor((window._dngColors || {})[key]);
  },
  // The prize this dungeon holds, for the card's icon row. Read from the slot's
  // own image, which is where every prize change (manual cycle, ROM auto-mark)
  // already lands — so there is no second copy to keep in step.
  prize: function(key) {
    var img = document.querySelector('[data-dungeon-key="' + key + '"] .prize-img');
    if (!img || !img.src) return null;
    var src = img.src;
    var name = src.indexOf('greenpendant') !== -1 ? 'greenpendant'
             : src.indexOf('redcrystal')   !== -1 ? 'redcrystal'
             : src.indexOf('pendant')      !== -1 ? 'pendant'
             : src.indexOf('unknown')      !== -1 ? 'unknown'
             : 'crystal';
    return { name: name, obtained: src.indexOf('0.png') !== -1 };
  },
  // Pots + enemy drops together, for the card's drop rollup. items.js owns the
  // arithmetic; this is just the hook.
  nonChest: function(key) {
    return window.dungeonNonChest ? window.dungeonNonChest(key) : null;
  },
  counts: function(key) {
    var d = (window.dungeons || {})[key];
    if (!d) return null;
    var effMax = Math.max(0, (d.maxItems || 0) - (d.skipped || 0));
    var c = {
      items:    Math.min(d.itemCount || 0, effMax),
      maxItems: d.totalUnknown ? '?' : effMax,   // Door Shuffle Crossed, not seen yet
      // Chests the player waved off (left-click while autotracking). They never
      // set a flag, so the card has to be told or they'd sit "left" forever.
      skipped:  d.skipped || 0,
      // Keys COLLECTED ($7EF4E0+, which only ever rises) — the count the
      // logic and the card both answer to.
      keys:     d.smallKeyCount || 0,
      keysFound: Math.max(d.smallKeyCount || 0, d.smallKeyMax || 0),
      maxKeys:  d.keysUnknown ? '?' : (d.maxSmallKeys || 0),
      bigkey:   d.bigkeyState   || 0
    };
    // A dungeon without a map or compass slot leaves the field out entirely, so
    // the panel omits that icon instead of drawing a permanently dim one.
    if (!d.noMap)     c.map     = d.mapState     || 0;
    if (!d.noCompass) c.compass = d.compassState || 0;
    return c;
  },
  completion: function(key) {
    var slot = document.querySelector('.dungeon-slot[data-dungeon-key="' + key + '"]');
    if (!slot) return null;
    return {
      fullyCleared: slot.classList.contains('completed-full'),
      // 'prize-obtained' is the boss-down-but-items-remain state.
      cleared:      slot.classList.contains('prize-obtained')
    };
  },
  // Live item states for the per-location rules. `items` is items.js's own
  // object (a top-level const, so it's reachable by name); window.trackerItems
  // in this window only carries keys and medallions.
  items: function() {
    var out = {};
    ['bow','boomerang','hookshot','bomb','mushroom','powder','firerod','icerod',
     'bombos','ether','quake','lamp','hammer','shovel','flute','net','book',
     'somaria','byrna','cape','mirror','boots','gloves','flippers','moonpearl',
     'sword','shield','tunic','agahnim'].forEach(function(k) {
      try { out[k] = (items[k] && items[k].currentState) || 0; } catch (e) { out[k] = 0; }
    });
    return out;
  },
  bossOk: function(key) {
    var d = (window.dungeons || {})[key];
    if (!d || !d.bossState) return null;   // no boss picked / unknown boss
    if (typeof BOSS_REQUIREMENTS === 'undefined') return null;
    var req = BOSS_REQUIREMENTS[d.bossState];
    // A known boss with no item requirement is beatable — true, not null,
    // which the card reads as "boss unknown".
    return req ? !!req() : true;
  }
};

// Delegated hover: dungeon slots are rebuilt whenever the layout or dungeon-item
// mode changes, so binding per element would need re-binding every time.
document.addEventListener('mouseover', function(e) {
  // The card only exists here when "Show Dungeon Chests" is on: without the
  // chest list it was just the counts the slot already shows (Chris: "that is
  // too much"). The map's hover is unaffected.
  if (ITEM_SETTINGS.dungeonChests !== true) return;
  var t = e.target;
  // CT is a .ct-group rather than a .dungeon-slot, but it carries the same key.
  var slot = (t && t.closest)
    ? t.closest('.dungeon-slot[data-dungeon-key], .ct-group[data-dungeon-key]') : null;
  if (!slot || slot === window._dngHoverSlot) return;
  window._dngHoverSlot = slot;
  if (window.showDungeonPanel) window.showDungeonPanel(slot.dataset.dungeonKey, slot);
});
document.addEventListener('mouseout', function(e) {
  if (!window._dngHoverSlot) return;
  var to = e.relatedTarget;
  if (to && window._dngHoverSlot.contains(to)) return;
  window._dngHoverSlot = null;
  if (window.hideDungeonPanel) window.hideDungeonPanel();
});

// ── Set up BroadcastChannel so items.js can broadcast to map ──────────────────
try { window._itemsBc = new BroadcastChannel('alttp-tracker'); } catch(e) {}

// ── Listen for newgame from map on a separate channel instance ────────────────
var _itemsResettingGame = false;
try {
  var _itemsReceiveBc = new BroadcastChannel('alttp-tracker');
  _itemsReceiveBc.onmessage = function(e) {
    if (e.data && e.data.type === 'requestSnap') {
      if (typeof broadcastItemSnap === 'function') broadcastItemSnap();
      return;
    }
    // Swordless toggled in the map's settings menu. The storage event in
    // items.js covers this too; both paths are here because BroadcastChannel
    // is unreliable across Electron windows and storage events don't fire in
    // the window that wrote the value. applySwordlessMode is idempotent, so
    // whichever arrives first wins and the other is a no-op.
    // World State changed in the map's settings menu (Retro in particular
    // changes chest counts and the key readouts). applyWorldStateChange is
    // idempotent, so the storage-event path arriving too is a no-op.
    if (e.data && e.data.type === 'setprize') {
      if (window.setDungeonPrize) window.setDungeonPrize(e.data.key, e.data.name);
      return;
    }
    if (e.data && e.data.type === 'dungeoncolors') {
      window.applyDungeonColors(e.data.data);
      return;
    }
    if (e.data && e.data.type === 'worldstate') {
      if (typeof window.applyWorldStateChange === 'function') {
        window.applyWorldStateChange(e.data.data);
      }
      return;
    }
    // Generic settings relay from the map's gear menu. The storage-event path
    // in items.js covers the same keys; both apply functions are idempotent.
    if (e.data && e.data.type === 'setting') {
      var _k = e.data.key, _v = e.data.value;
      if (_k === 'alttp-dungeon-items' && typeof window.applyDungeonItemsChange === 'function') {
        window.applyDungeonItemsChange(_v);
      } else if (_k === 'alttp-bossshuffle' && typeof window.applyBossShuffleChange === 'function') {
        window.applyBossShuffleChange(_v);
      } else if (_k === 'alttp-universal-keys' && typeof window.applyUniversalKeysChange === 'function') {
        window.applyUniversalKeysChange(_v);
      } else if (_k === 'alttp-keydrop' && typeof window.applyKeyDropChange === 'function') {
        window.applyKeyDropChange(_v);
      } else if (_k === 'alttp-enemy-keydrop' && typeof window.applyEnemyKeyDropChange === 'function') {
        window.applyEnemyKeyDropChange(_v);
      } else if (_k === 'alttp-keydrop-all' && typeof window.applyKeyDropAllChange === 'function') {
        window.applyKeyDropAllChange(_v);
      } else if (_k === 'alttp-pot-drops' && typeof window.applyPotDropsChange === 'function') {
        window.applyPotDropsChange(_v);
      } else if (_k === 'alttp-enemy-drops' && typeof window.applyEnemyDropsChange === 'function') {
        window.applyEnemyDropsChange(_v);
      } else if (_k === 'alttp-pots-bones' && typeof window.applyPotsBonesChange === 'function') {
        window.applyPotsBonesChange(_v);
      } else if (_k === 'alttp-random-prize' && typeof window.applyRandomPrizeChange === 'function') {
        window.applyRandomPrizeChange(_v);
      } else if (_k === 'alttp-door-shuffle' && typeof window.applyDoorShuffleChange === 'function') {
        window.applyDoorShuffleChange(_v);
      }
      return;
    }
    if (e.data && e.data.type === 'dngskip') {
      if (typeof window.onDngSkipChanged === 'function') {
        window.onDngSkipChanged(e.data.key, e.data.count);
      }
      return;
    }
    if (e.data && e.data.type === 'swordless') {
      if (typeof window.applySwordlessMode === 'function') {
        window.applySwordlessMode(e.data.data === 'yes');
      }
      return;
    }
    if (e.data && e.data.type === 'newgame') {
      if (_itemsResettingGame) return;
      if (typeof resetItemTracker === 'function') {
        _itemsResettingGame = true;
        resetItemTracker();
        setTimeout(function() { _itemsResettingGame = false; }, 1000);
      }
    }
  };
} catch(e) {}


// ── Load host/port from launcher settings before items.js connectWebSocket ────
(function() {
  var host = localStorage.getItem('alttp-ws-host') || 'localhost';
  var port = parseInt(localStorage.getItem('alttp-ws-port') || '23074');
  wsHost = host;   // items.js `let wsHost`
  wsPort = port;   // items.js `let wsPort`
})();

// ── Scale and background from URL params ──────────────────────────────────────
(function() {
  var p = new URLSearchParams(window.location.search);
  window._trackerScale = parseFloat(p.get('scale')) || 1;
  if (window._trackerScale !== 1) document.body.style.zoom = window._trackerScale;

  // Store dungeonItems mode for reference
  window._dungeonItemsMode = p.get('dungeonitems') || localStorage.getItem('alttp-dungeon-items') || 'standard';

  // Race Mode flag (shown as a "RACE" label left of the dungeon-mode label).
  window._raceMode = (p.get('race') || localStorage.getItem('alttp-race-mode') || 'no') === 'yes';

  // Boss shuffle flag — when "no" the bosses are vanilla so we hide the boss
  // When boss shuffle is off, circles stay visible but are locked to vanilla
  // assignments (CSS disables interaction; DOMContentLoaded seeds the bosses).
  window._bossShuffle = p.get('bossshuffle') || localStorage.getItem('alttp-bossshuffle') || 'yes';
  if (window._bossShuffle === 'no') {
    document.documentElement.classList.add('no-boss-shuffle');
    // Pre-populate vanilla boss assignments once the dungeon slots exist.
    // Boss numbers match items.js boss image indices (boss1.png … boss10.png):
    //   1=Armos Knights, 2=Lanmolas, 3=Moldorm, 4=Helmasaur King,
    //   5=Arrghus, 6=Mothula, 7=Blind, 8=Kholdstare, 9=Vitreous, 10=Trinexx
    var VANILLA_BOSSES = {
      ep: 1, dp: 2, toh: 3, pod: 4, sp: 5,
      sw: 6, tt: 7, ip: 8, mm: 9, tr: 10
    };
    document.addEventListener('DOMContentLoaded', function() {
      Object.keys(VANILLA_BOSSES).forEach(function(key) {
        if (typeof setBoss === 'function') setBoss(key, VANILLA_BOSSES[key]);
      });
    });
  }

  // Set mode label in bottom bar
  document.addEventListener('DOMContentLoaded', function() {
    var lbl = document.getElementById('item-mode-label');
    if (lbl) {
      // js/items.js owns the wording — one definition for every writer.
      lbl.textContent = window.dungeonModeLabel ? window.dungeonModeLabel() : 'STD';
    }
    var raceLbl = document.getElementById('item-race-label');
    if (raceLbl) raceLbl.textContent = window._raceMode ? 'RACE' : '';
  });

  // Background color — apply data-bg early so there's no flash before the
  // settings system initialises. Also restores the image background.
  var bg = p.get('bg') || localStorage.getItem('alttp-tracker-bg') || 'black';
  var bgImg = localStorage.getItem('alttp-itemtracker-bg-image') || '';
  if (bg === 'image' && !bgImg) bg = 'black';
  if (bg !== 'black') {
    document.documentElement.setAttribute('data-bg', bg);
  }
  if (bg === 'image' && bgImg) {
    document.documentElement.style.setProperty('--bg-image', 'url("' + bgImg + '")');
  }
})();

// ── Self-resize: measure content after render and fit window to it ────────────
// Snap the window to hug the tracker content, trimming the launch-time border.
// Width MUST be read from the content element, not body.scrollWidth: `overflow-x:
// hidden` on html/body clamps body.scrollWidth to the viewport, so it can never
// report a width smaller than the current window and the window can only grow.
// .tracker-container is width:fit-content, so its offsetWidth is the true width.
function fitWindowToContent() {
  try {
    var s = window._trackerScale || 1;
    var body = document.body;
    var container = document.getElementById('stk-root') || document.querySelector('.tracker-container');
    var chromeW = window.outerWidth  - window.innerWidth;
    var chromeH = window.outerHeight - window.innerHeight;
    if (chromeW < 0) chromeW = 0;      // macOS has no left/right window chrome
    if (chromeH <= 0) chromeH = 28;    // title-bar fallback
    var contentW = container ? container.offsetWidth : body.scrollWidth;
    // scrollWidth/offsetWidth/scrollHeight are pre-zoom logical px — scale them.
    // SIDE_PAD adds a little breathing room; the body centres the content, so it
    // splits evenly left/right and keeps the edge dungeon borders (POD, GT) off
    // the window frame.
    var SIDE_PAD = 8;
    var w = Math.ceil(contentW * s) + chromeW + SIDE_PAD;
    var h = Math.ceil(body.scrollHeight * s) + chromeH + 4;
    window.resizeTo(w, h);
  } catch(e) {}
}
window.addEventListener('load', function() {
  setTimeout(fitWindowToContent, 200);
});

// ── Hook: broadcast prizes whenever a dungeon prize changes ───────────────────
function broadcastPrizes() {
  if (!window._itemsBc) return;
  try {
    var prizes = {};
    Object.keys(dungeons).forEach(function(key) {
      if (dungeons[key].bigkeyOnly) return;
      var prizeImg = document.querySelector('[data-dungeon-key="' + key + '"] .prize-img');
      if (!prizeImg) return;
      var src = prizeImg.src || '';
      // Derive prize name from image src
      var name = 'unknown';
      if      (src.includes('greenpendant')) name = 'greenpendant';
      else if (src.includes('pendant'))      name = 'pendant';
      else if (src.includes('redcrystal'))   name = 'redcrystal';
      else if (src.includes('crystal'))      name = 'crystal';
      prizes[key] = {
        name:         name,
        obtained:     src.includes('1.png'),
        mapState:     dungeons[key] ? (dungeons[key].mapState || 0) : 0,
        otherCleared: dungeons[key] ? (dungeons[key].otherCleared || false) : false,
        // Against the EFFECTIVE target: a chest the player waved off lowers what
        // the dungeon still owes, so skipping the rest finishes it — the map
        // then shades it as done rather than leaving it boss-cleared forever.
        allItems:     dungeons[key]
                        ? (dungeons[key].itemCount >=
                           Math.max(0, (dungeons[key].maxItems || 0) - (dungeons[key].skipped || 0)))
                        : false,
        bossCleared:  dungeons[key] ? (dungeons[key].bossDefeated || false) : false
      };
    });
    var mm = window.trackerItems ? (window.trackerItems.mmMedallion || 0) : 0;
    var tr = window.trackerItems ? (window.trackerItems.trMedallion || 0) : 0;
    window._itemsBc.postMessage({ type: 'prizes', data: prizes, mmMedallion: mm, trMedallion: tr });
  } catch(e) {}
}

window.onPrizeCycled = function() { setTimeout(broadcastPrizes, 30); };

// ── Medallion label cycling → broadcast items ─────────────────────────────────
var _origCycleLabel = window.cycleMedallionLabel;
window.cycleMedallionLabel = function(itemKey, slot) {
  var medIdx = {bombos:1, ether:2, quake:3}[itemKey] || 0;
  if (!window.trackerItems) window.trackerItems = {};

  // Find what the OTHER two medallions are currently assigned to
  var otherMM = 0, otherTR = 0;
  ['bombos','ether','quake'].forEach(function(k) {
    if (k === itemKey) return;
    var lbl = items[k] ? items[k].medallionLabel : '';
    var idx = {bombos:1, ether:2, quake:3}[k] || 0;
    if (lbl === 'MM' || lbl === 'BOTH') otherMM = idx;
    if (lbl === 'TR' || lbl === 'BOTH') otherTR = idx;
  });

  // Build available labels: always include '' (clear); include MM if not taken by another,
  // TR if not taken by another, BOTH if neither is taken by another
  var labels = [''];
  if (!otherMM) labels.push('MM');
  if (!otherTR) labels.push('TR');
  if (!otherMM && !otherTR) labels.push('BOTH');

  var currentLabel = items[itemKey] ? items[itemKey].medallionLabel : '';
  var currentIdx = labels.indexOf(currentLabel);
  // If current label is no longer valid (e.g. another medallion took it), reset to ''
  var nextLabel = labels[(currentIdx + 1) % labels.length];

  // Update items.js state
  if (items[itemKey]) items[itemKey].medallionLabel = nextLabel;
  var labelDiv = slot.querySelector('.medallion-label');
  if (labelDiv) labelDiv.textContent = nextLabel;

  // Compute new mm/tr values
  var mm = otherMM;
  var tr = otherTR;
  if      (nextLabel === 'MM')   { mm = medIdx; }
  else if (nextLabel === 'TR')   { tr = medIdx; }
  else if (nextLabel === 'BOTH') { mm = medIdx; tr = medIdx; }

  window.trackerItems.mmMedallion = mm;
  window.trackerItems.trMedallion = tr;

  // Send medallions message first so map updates immediately
  if (window._itemsBc) {
    window._itemsBc.postMessage({ type: 'medallions', data: {
      mmMedallion: mm,
      trMedallion: tr
    }});
  }
  // Then send full snap
  if (window.broadcastItemSnap) window.broadcastItemSnap();
};

// transition so the effect animation doesn't replay on every refresh.
function applyOneItemFill(el, isFilled) {
  if (!el) return;
  var was = el.classList.contains('filled');
  if (isFilled === was) return;
  if (isFilled) {
    el.classList.remove('fx-falling', 'fx-fade', 'fx-edges', 'fx-pulse');
    el.classList.add('filled');
    if (ITEM_SETTINGS.fillEffect === 'falling')   { void el.offsetWidth; el.classList.add('fx-falling'); }
    if (ITEM_SETTINGS.fillEffect === 'starburst') { void el.offsetWidth; el.classList.add('fx-fade'); }
    if (ITEM_SETTINGS.fillEffect === 'none')      { void el.offsetWidth; el.classList.add('fx-edges'); }
    if (ITEM_SETTINGS.fillEffect === 'pulse')     { void el.offsetWidth; el.classList.add('fx-pulse'); }
  } else {
    el.classList.remove('filled', 'fx-falling', 'fx-fade', 'fx-edges', 'fx-pulse');
  }
}

// Re-evaluate every item slot's fill from current item state. Exposed as a
// global so items.js can call it whenever item state changes.
function refreshItemFills() {
  var on = ITEM_SETTINGS.fillEnabled;
  document.querySelectorAll('.item-slot[data-item-key]').forEach(function(slot) {
    if (slot.classList.contains('go-mode')) return;
    var key = slot.dataset.itemKey;
    if (!key || key === 'stats') return;
    var have = on && items[key] && items[key].currentState > 0;
    // Seed-flag cosmetics show a variant at state 0 (present from game load), so
    // fill their slot even before the real item is obtained when the flag is on.
    if (on && typeof seedFlagOverlay === 'function' && seedFlagOverlay(key, 0)) have = true;
    applyOneItemFill(slot, have);
  });
  // The boomerang square's two halves: boomerang1 (blue) / boomerang2 (red),
  // boomerang0 greyed when not found; each half fills on its own.
  var boom = document.querySelector('.item-slot.boom-combo');
  if (boom && items.boomerang) {
    var bs = items.boomerang.currentState || 0;
    var base = items.boomerang.states[0].img.replace(/boomerang00\.png$/, '');
    [['blue', 1, 'boomerang1'], ['red', 2, 'boomerang2']].forEach(function (h) {
      var half = boom.querySelector('.boom-' + h[0]); if (!half) return;
      var got = !!(bs & h[1]);
      var want = base + (got ? h[2] : 'boomerang0') + '.png';
      var im = half.querySelector('img');
      if (im.getAttribute('src') !== want) im.src = want;
      half.classList.toggle('got', got);
    });
  }
  var grid = document.querySelector('.bottle-grid');
  if (grid) {
    var anyBottle = ['bottle1','bottle2','bottle3','bottle4'].some(function(b){
      return items[b] && items[b].currentState > 0;
    });
    applyOneItemFill(grid, on && anyBottle);
  }
}
window.refreshItemFills = refreshItemFills;

function initItemSettings() {
  loadItemSettings();
  applyItemFillVariable();
  applyItemDungeonColors();
  applyChecksColor();
  applyItemDungeonFill();
  applyItemBg(ITEM_SETTINGS.bg);
  applyItemDungeonBox();
  applyShowBoss();
  applyWorldBox();
  refreshItemFills();
  publishDefaultPrize();
}

// The Settings window can't see this session's default-prize pick (it is never
// stored for the next launch), so it is published here for that window to show.
function publishDefaultPrize() {
  try { localStorage.setItem('alttp-itemtracker-default-prize-now', ITEM_SETTINGS.defaultPrize); } catch (e) {}
}

// Settings live in their own window now (the Item Tracker tab of Settings).
function openItemSettings() {
  publishDefaultPrize();
  if (window.electronAPI && window.electronAPI.openItemSettings) window.electronAPI.openItemSettings();
  else window.open('itemtracker-settings.html', 'alttp-settings', 'width=480,height=820,resizable=yes,scrollbars=yes');
}

// That window writes localStorage and pings here; re-read and re-apply.
var _layoutAtLoad = (function () { try { return localStorage.getItem('alttp-items-layout') === 'stacked' ? 'stacked' : 'standard'; } catch (e) { return 'standard'; } })();
try {
  new BroadcastChannel('alttp-item-settings').onmessage = function (e) {
    if (!e.data || e.data.type !== 'item-settings-changed') return;
    var lay = 'standard';
    try { lay = localStorage.getItem('alttp-items-layout') === 'stacked' ? 'stacked' : 'standard'; } catch (er) {}
    if (lay !== _layoutAtLoad) { location.reload(); return; }   // the stacked rows are built once at load
    var prevBg = ITEM_SETTINGS.bg, prevChests = ITEM_SETTINGS.dungeonChests;
    var prevPrize = ITEM_SETTINGS.defaultPrize, prevWorld = ITEM_SETTINGS.worldBox;
    loadItemSettings();
    // loadItemSettings lets the window's ?bg= win; here the new stored choice must.
    try { ITEM_SETTINGS.bg = localStorage.getItem('alttp-tracker-bg') || 'black'; } catch (er) {}
    if (ITEM_SETTINGS.bg === 'image' && !ITEM_SETTINGS.bgImage) ITEM_SETTINGS.bg = 'black';
    applyItemFillVariable(); applyItemDungeonColors(); applyChecksColor();
    applyItemDungeonFill(); applyItemDungeonBox(); applyShowBoss(); applyWorldBox(); refreshItemFills();
    // The boxes add a few px to View-2's width, so refit the window.
    if (prevWorld !== ITEM_SETTINGS.worldBox && typeof fitWindowToContent === 'function') setTimeout(fitWindowToContent, 50);
    if (ITEM_SETTINGS.bg !== prevBg || ITEM_SETTINGS.bg === 'image') applyItemBg(ITEM_SETTINGS.bg);
    if (e.data.defaultPrize && e.data.defaultPrize !== prevPrize) {
      window._prizeOverride = e.data.defaultPrize;   // session-only, as before
      ITEM_SETTINGS.defaultPrize = e.data.defaultPrize;
      if (window.applyDefaultPrizeToAll) window.applyDefaultPrizeToAll();
    }
    if (prevChests && !ITEM_SETTINGS.dungeonChests) {
      window._dngHoverSlot = null;
      if (window.hideDungeonPanel) window.hideDungeonPanel();
    } else if (ITEM_SETTINGS.dungeonChests && window.refreshDungeonPanel) {
      window.refreshDungeonPanel();
    }
  };
} catch (e) {}

// ── DOMContentLoaded: init tracker then connect via items.js stack ────────────
document.addEventListener('DOMContentLoaded', function() {
  // createTracker() was already called by items.js DOMContentLoaded handler.
  // Initialise the settings customization (needs the rendered slots).
  initItemSettings();
  // Start WS using items.js's own connectWebSocket (already has UI hooks).
  connectWebSocket();
  // Broadcast initial prizes and full item snap once DOM is ready
  setTimeout(broadcastPrizes, 500);
  setTimeout(function() { if (window.broadcastItemSnap) window.broadcastItemSnap(); }, 600);
});

// ── Scale adjustment from bottom bar buttons ──────────────────────────────────
function changeTrackerScale(delta) {
  var current = window._trackerScale || 1;
  // 5% steps, clamped 50%–150% to match the Map scale control.
  var next = Math.min(1.5, Math.max(0.5, Math.round((current + delta) * 20) / 20));
  window._trackerScale = next;
  document.body.style.zoom = next;
  // Resize window to fit new scale (same content-based measurement as launch).
  setTimeout(fitWindowToContent, 50);
}

// ── New Game hotkey: main fires it here (the key itself is set in Settings) ──
(function() {
  // Listen for newgame fired from main process via the hotkey.
  // Do NOT set _itemsResettingGame here — this is an originating event,
  // not a received broadcast, so resetItemTracker() must be free to
  // broadcast {type:'newgame'} to the map and broadcast windows.
  if (window.electronAPI && window.electronAPI.onNewgame) {
    window.electronAPI.onNewgame(function() {
      if (typeof resetItemTracker === 'function') resetItemTracker();
    });
  }
})();
</script>
